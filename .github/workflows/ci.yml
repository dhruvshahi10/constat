name: ci
on: [push, pull_request]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      # the gates decide release; their branches must be covered
      - run: python -m pytest tests/test_claim_gates.py tests/test_golden.py tests/test_review.py tests/test_pipeline2.py -q --cov=constat.claims.gates --cov-branch --cov-fail-under=95
      # the golden set is the release gate for the claims layer: zero dangerous failures
      - run: python evals/run_golden.py --split dev
      - run: python evals/run_golden.py --split holdout
      # every injection case must be quarantined at intake or refused by the gate
      - run: python evals/run_injection.py
      # the claim-drafting assistant never drafts an instruction, a plan or marketing, and keeps every exception
      - run: python evals/run_author.py
      # a model id or prompt version change must ship with a new eval record
      - run: git fetch --no-tags --depth=50 origin ${{ github.base_ref || 'master' }} || true
      - run: python scripts/check_eval_record.py --base origin/${{ github.base_ref || 'master' }} || true
